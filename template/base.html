<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewreport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Beranda{% endblock %} | {{% nama_usaha %}}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>


    <nav class="navbar navbar-expand navbar-dark bg-success px-3">
        <a class="navbar-brand" href="{{url_for ('beranda') }}">{{ nama_usaha }}</a>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('beranda') }}">Beranda</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('tentang') }}">Tentang</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('katalog') }}">Katalog</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('kontak') }}">Kontak</a></li>
        </ul>
    </nav>

    <main class="container py-4">
        {% block content %} {% endblock %}
    </main>

    <footer class="text-center text-muted border-top py-3">
        &copy; 2026 {{ nama_usaha }}
    </footer>
    
</body>    
</html>
